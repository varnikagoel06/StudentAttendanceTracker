
apiVersion: apps/v1
kind: Deployment
metadata:
  name: attendance-app
spec:
  replicas: 4
  selector:
    matchLabels:
      app: attendance-app
  template:
    metadata:
      labels:
        app: attendance-app
    spec:
      containers:
        - name: student-attendance-tracker
          image: student-attendance-tracker:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
